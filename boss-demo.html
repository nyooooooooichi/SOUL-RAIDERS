<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title>SOUL RAIDERS | GLB 操作デモ</title>
<style>
:root{color-scheme:dark;--cyan:#6de9e1;--line:#294355}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d18;color:#edf7ff;font-family:system-ui,"Noto Sans JP",sans-serif;touch-action:none}
#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.hud{position:fixed;z-index:3;pointer-events:none;inset:0;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 12px)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.brand{font-weight:900;letter-spacing:.12em;font-size:13px;color:var(--cyan);text-shadow:0 0 16px #50e7dd55}.sub{font-size:11px;color:#9bb1c3;margin-top:3px}
.pill{border:1px solid #6de9e155;background:#081722bb;border-radius:20px;padding:7px 11px;font-size:11px;color:#c9f8f4}
#status{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);font-size:12px;color:#c9d8e6;background:#081722bb;border:1px solid #294355;border-radius:20px;padding:7px 13px;white-space:nowrap}
#loading{position:fixed;z-index:8;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,#183344,#080d18 70%);text-align:center;padding:24px}
.loadbox{max-width:340px}.spinner{width:34px;height:34px;border:3px solid #31505d;border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}@keyframes spin{to{transform:rotate(360deg)}}
#loadtext{font-size:13px;color:#d5e8f1;line-height:1.7}
.controls{position:fixed;z-index:4;inset:auto 0 0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 18px calc(env(safe-area-inset-bottom) + 18px);pointer-events:none}
.pad{width:148px;height:148px;position:relative;pointer-events:auto;border:1px solid #8ce9e455;border-radius:50%;background:#0b1b2b88;box-shadow:inset 0 0 30px #6de9e10c,0 8px 30px #0007;touch-action:none}
#stick{position:absolute;width:58px;height:58px;left:44px;top:44px;border-radius:50%;background:linear-gradient(145deg,#b6fff6,#3a9f9b);box-shadow:0 4px 20px #48ded477;border:2px solid #d4fffa}
.actions{display:grid;grid-template-columns:repeat(2,62px);gap:10px;pointer-events:auto;align-items:end}
.act{width:62px;height:62px;border-radius:50%;border:1px solid #79e9e477;background:linear-gradient(145deg,#1c4054eF,#0b1b2beF);color:#eaffff;font-weight:800;font-size:12px;box-shadow:0 7px 20px #0008;touch-action:none}
.act.big{width:72px;height:72px;background:linear-gradient(145deg,#247d7c,#123b4b);font-size:13px}
.act:active{transform:scale(.94);filter:brightness(1.3)}
.bottomhint{position:fixed;z-index:2;bottom:calc(env(safe-area-inset-bottom) + 178px);left:50%;transform:translateX(-50%);font-size:10px;color:#c4d7e2aa;white-space:nowrap;pointer-events:none}
.desktop{display:none}
#menu{position:fixed;z-index:5;right:14px;top:65px;display:flex;gap:7px}
.small{border:1px solid #6de9e155;background:#081722cc;color:#e8ffff;border-radius:12px;padding:8px 10px;font-size:11px}
@media (min-width:800px){.controls{padding:0 34px 28px}.pad{width:166px;height:166px}.desktop{display:block;position:fixed;z-index:2;bottom:25px;left:50%;transform:translateX(-50%);font-size:11px;color:#c4d7e2aa;white-space:nowrap}.bottomhint{display:none}}
@media (max-width:420px){.pad{width:128px;height:128px}.pad #stick{left:34px;top:34px}.actions{grid-template-columns:repeat(2,56px);gap:7px}.act{width:56px;height:56px}.act.big{width:64px;height:64px}.controls{padding-left:13px;padding-right:13px}.bottomhint{bottom:calc(env(safe-area-inset-bottom) + 155px)}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="hud"><div class="top"><div><div class="brand">SOUL RAIDERS / MODEL LAB</div><div class="sub">CUSTOM GLB · PLAYABLE DEMO</div></div><div class="pill">PROTOTYPE 01</div></div><div id="status">読み込み中…</div></div>
<div id="menu"><button class="small" id="cameraBtn">視点リセット</button><button class="small" id="motionBtn">モーション ON</button></div>
<div class="bottomhint">左スティック：移動　／　右ボタン：アクション</div>
<div class="desktop">WASD / 矢印：移動　　J：攻撃　　K：ジャンプ　　マウスドラッグ：視点回転　　ホイール：ズーム</div>
<div class="controls">
 <div class="pad" id="pad"><div id="stick"></div></div>
 <div class="actions"><button class="act" id="attack">ATTACK<br>J</button><button class="act" id="jump">JUMP<br>K</button><button class="act" id="turn">TURN</button><button class="act big" id="dash">DASH</button></div>
</div>
<div id="loading"><div class="loadbox"><div class="spinner"></div><div id="loadtext">3Dモデルを読み込んでいます…</div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';
const MODEL='./assets/897921242_1649735819862211_1992601279296611975_n%20(1).glb';
const stage=document.querySelector('#stage'),status=document.querySelector('#status'),loading=document.querySelector('#loading'),loadtext=document.querySelector('#loadtext');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x080d18);scene.fog=new THREE.Fog(0x080d18,13,36);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(0,3.1,7.5);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;stage.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9edbff,0x18202c,2.0));
const key=new THREE.DirectionalLight(0xffffff,3.1);key.position.set(4,8,5);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);
const rim=new THREE.PointLight(0x36d9e2,18,14);rim.position.set(-4,3,-3);scene.add(rim);
const floor=new THREE.Mesh(new THREE.CircleGeometry(16,80),new THREE.MeshStandardMaterial({color:0x101d2b,roughness:.9,metalness:.1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.025;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(30,30,0x28616a,0x1a3442);grid.position.y=0;scene.add(grid);
const ring=new THREE.Mesh(new THREE.TorusGeometry(1.65,.018,8,100),new THREE.MeshBasicMaterial({color:0x48d8d4,transparent:true,opacity:.48}));ring.rotation.x=Math.PI/2;ring.position.y=.015;scene.add(ring);
const root=new THREE.Group();scene.add(root);let model=null,modelHeight=2,modelScale=1,modelBaseY=0,enabled=true;
let yaw=0,moveX=0,moveY=0,velY=0,jumpY=0,attackT=0,dashT=0,turnPulse=0,elapsed=0;
const target=new THREE.Vector3(0,1,0),camOffset=new THREE.Vector3(0,2.6,7.2);let orbit=0,zoom=1,drag=null;
function setStatus(s){status.textContent=s}
try{
 const gltf=await new GLTFLoader().loadAsync(MODEL);model=gltf.scene;root.add(model);
 model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material.side=THREE.FrontSide;}}});
 const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
 modelHeight=Math.max(size.y,.5);model.position.sub(center);model.position.y+=modelHeight*.5;
 modelScale=2.15/modelHeight;model.scale.setScalar(modelScale);modelHeight=2.15;
 const scaledBox=new THREE.Box3().setFromObject(model);model.position.y-=scaledBox.min.y;modelBaseY=model.position.y;
 const sphere=new THREE.Sphere();scaledBox.getBoundingSphere(sphere);
 camera.position.set(0,Math.max(2.8,sphere.radius*1.2),Math.max(5.2,sphere.radius*3.1));zoom=1;
 loadtext.textContent='モデル読み込み完了';loading.style.opacity='0';setTimeout(()=>loading.remove(),350);setStatus('操作できます');
}catch(e){console.error(e);loadtext.textContent='モデルを読み込めませんでした。通信環境を確認して再読み込みしてください。';setStatus('GLB読み込みエラー');document.querySelector('.controls').style.display='none';}
function doJump(){if(jumpY<=.01)velY=5.7}
function doAttack(){attackT=.62}
function doDash(){dashT=.24}
function resetCamera(){orbit=0;zoom=1}
document.querySelector('#cameraBtn').onclick=resetCamera;
document.querySelector('#motionBtn').onclick=()=>{enabled=!enabled;document.querySelector('#motionBtn').textContent='モーション '+(enabled?'ON':'OFF')};
document.querySelector('#attack').onpointerdown=e=>{e.preventDefault();doAttack()};
document.querySelector('#jump').onpointerdown=e=>{e.preventDefault();doJump()};
document.querySelector('#dash').onpointerdown=e=>{e.preventDefault();doDash()};
document.querySelector('#turn').onpointerdown=e=>{e.preventDefault();yaw+=Math.PI/2;turnPulse=.3};
const pad=document.querySelector('#pad'),stick=document.querySelector('#stick');let padPointer=null;
function updateStick(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.32,len=Math.hypot(dx,dy),k=Math.min(1,max/(len||1));moveX=dx*k/max;moveY=dy*k/max;stick.style.transform='translate('+dx*k+'px,'+dy*k+'px)'}
pad.addEventListener('pointerdown',e=>{padPointer=e.pointerId;pad.setPointerCapture(e.pointerId);updateStick(e)});
pad.addEventListener('pointermove',e=>{if(e.pointerId===padPointer)updateStick(e)});
function releasePad(e){if(e.pointerId!==padPointer)return;padPointer=null;moveX=moveY=0;stick.style.transform='translate(0,0)'}
pad.addEventListener('pointerup',releasePad);pad.addEventListener('pointercancel',releasePad);
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.repeat)return;const k=e.key.toLowerCase();if(k==='j')doAttack();if(k==='k'||k===' ')doJump();if(k==='shift')doDash();});
const keys=new Set();addEventListener('keydown',e=>keys.add(e.key.toLowerCase()));addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){drag={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)}});
renderer.domElement.addEventListener('pointermove',e=>{if(drag){orbit-=(e.clientX-drag.x)*.006;drag={x:e.clientX,y:e.clientY}}});
renderer.domElement.addEventListener('pointerup',()=>drag=null);renderer.domElement.addEventListener('wheel',e=>{zoom=Math.max(.65,Math.min(1.8,zoom+e.deltaY*.001));},{passive:true});
let last=performance.now();
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.04);last=now;elapsed+=dt;
 if(model){
  let x=moveX,y=moveY;
  if(keys.has('a')||keys.has('arrowleft'))x-=1;if(keys.has('d')||keys.has('arrowright'))x+=1;if(keys.has('w')||keys.has('arrowup'))y-=1;if(keys.has('s')||keys.has('arrowdown'))y+=1;
  const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}
  const speed=dashT>0?8:3.25;root.position.x+=x*speed*dt;root.position.z+=y*speed*dt;
  root.position.x=THREE.MathUtils.clamp(root.position.x,-9,9);root.position.z=THREE.MathUtils.clamp(root.position.z,-9,9);
  if(l>.08)yaw=Math.atan2(x,y)+Math.PI;
  if(dashT>0)dashT=Math.max(0,dashT-dt);if(attackT>0)attackT=Math.max(0,attackT-dt);if(turnPulse>0)turnPulse-=dt;
  velY-=14*dt;jumpY=Math.max(0,jumpY+velY*dt);if(jumpY===0&&velY<0)velY=0;
  root.position.y=jumpY;
  root.rotation.y=yaw;
  const bob=enabled&&l>.08?Math.abs(Math.sin(elapsed*12))*.055:enabled?Math.sin(elapsed*2.4)*.025:0;
  const lean=attackT>0?-.34*Math.sin((1-attackT/.62)*Math.PI):dashT>0?-.2:0;
  model.rotation.x=lean+(enabled?Math.sin(elapsed*2)*.012:0);
  model.rotation.z=enabled?Math.sin(elapsed*2.8)*.018:0;
  model.position.y=modelBaseY+bob;
  const pulse=attackT>0?1+Math.sin((1-attackT/.62)*Math.PI)*.08:1;
  model.scale.setScalar(modelScale*pulse);
  ring.position.x=root.position.x;ring.position.z=root.position.z;ring.material.opacity=.28+Math.sin(elapsed*2)*.12;
  target.set(root.position.x,1.0+jumpY*.35,root.position.z);
  const desired=new THREE.Vector3(Math.sin(orbit)*7.1*zoom,2.8*zoom,Math.cos(orbit)*7.1*zoom).add(target);
  camera.position.lerp(desired,1-Math.exp(-5*dt));camera.lookAt(target);
  setStatus(dashT>0?'ダッシュ中':attackT>0?'攻撃モーション':'操作できます');
 }
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));});
</script>
</body></html>
